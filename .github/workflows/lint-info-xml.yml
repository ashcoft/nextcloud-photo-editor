name: Lint info.xml

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on: pull_request

permissions:
  contents: read

concurrency:
  group: lint-info-xml-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  xml-linters:
    runs-on: ubuntu-latest

    name: info.xml lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download schema
        # Pinned to a commit rather than `master`: a schema change upstream
        # would otherwise alter this check without a change here.
        run: wget https://raw.githubusercontent.com/nextcloud/appstore/61c5a352718249cc2c01cf28af7964a1472b9f91/nextcloudappstore/api/v1/release/info.xsd

      - name: Lint info.xml
        uses: ChristophWurst/xmllint-action@36f2a302f84f8c83fceea0b9c59e1eb4a616d3c1 # v1.2
        with:
          xml-file: ./appinfo/info.xml
          xml-schema-file: ./info.xsd
