# Opens a pull request when upstream PhotoCraft cuts a release.
#
# The editor is a vendored build, so its version is a shell variable rather than
# a package dependency and no dependency updater sees it. This workflow is that
# updater: it runs scripts/bump-photocraft.sh, then opens a pull request when the
# pin actually changed.
#
# SPDX-FileCopyrightText: 2026 Photo Editor Contributors
# SPDX-License-Identifier: MIT

name: PhotoCraft update

on:
  schedule:
    # Daily at 06:30 UTC, shortly after the Renovate run at 06:00.
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'PhotoCraft version to pin (default: latest upstream release)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: photocraft-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Bump the pin and re-vendor the bundle
        id: bump
        env:
          # Raises the API rate limit while resolving the release and its
          # checksum.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bound through the environment rather than interpolated into the
          # script, so a crafted value cannot inject commands.
          PHOTOCRAFT_VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bash scripts/bump-photocraft.sh "${PHOTOCRAFT_VERSION_INPUT}"
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          version="$(sed -n 's/^PHOTOCRAFT_VERSION="\([^"]*\)"/\1/p' scripts/fetch-photocraft.sh | head -1)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Require a token that triggers the pull_request checks
        if: steps.bump.outputs.changed == 'true'
        env:
          TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -z "${TOKEN}" ]; then
            echo "::error::RENOVATE_TOKEN is not configured; a pull request opened with the default token would not run this repository's pull_request checks."
            exit 1
          fi

      - name: Create Pull Request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          commit-message: 'fix(deps): Update PhotoCraft to ${{ steps.bump.outputs.version }}'
          committer: GitHub <noreply@github.com>
          author: nextcloud-command <nextcloud-command@users.noreply.github.com>
          signoff: true
          branch: automated/photocraft-update
          delete-branch: true
          title: 'Update PhotoCraft to ${{ steps.bump.outputs.version }}'
          labels: |
            dependencies
          body: |
            Bumps the vendored PhotoCraft editor to ${{ steps.bump.outputs.version }}.

            `scripts/bump-photocraft.sh` rewrote `PHOTOCRAFT_VERSION` and
            `PHOTOCRAFT_SHA256` together and re-ran `scripts/fetch-photocraft.sh`,
            so the committed bundle matches the new pin. The `photocraft-bundle`
            check re-fetches the release and fails if it does not.

            Before merging, confirm the `photocraft-bundle` and `e2e` checks pass.

            This pull request was created by an automated workflow on behalf of the repository maintainers.

