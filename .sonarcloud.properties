# SonarCloud configuration for Automatic Analysis.
#
# Automatic Analysis reads this file, not sonar-project.properties (which is for
# a CI-based scan).
#
# The embedded editor under photocraft/ is a vendored third-party build -
# minified WASM glue - so analysing it reports upstream's style as this
# repository's findings and fails the quality gate on duplication and on the
# reliability and security ratings. It is excluded for the same reason js/ and
# vendor/ are: it is not source maintained here.
sonar.exclusions=photocraft/**
