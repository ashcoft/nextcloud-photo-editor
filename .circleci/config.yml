# CircleCI mirror of the GitHub Actions checks, so a change is verified here
# too. The image matches the Node major in package.json's `engines`.
version: 2.1

jobs:
  node:
    docker:
      - image: cimg/node:24.22
    steps:
      - checkout
      # pnpm is pinned by `packageManager` in package.json, so corepack
      # installs exactly that version rather than a floating latest.
      - run:
          name: Enable pnpm
          command: corepack enable
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Lint and type-check
          command: |
            pnpm run lint
            pnpm run stylelint
            pnpm run check-types
      - run:
          name: Unit tests
          command: pnpm run test
      - run:
          name: Build
          command: pnpm run build

workflows:
  test:
    jobs:
      - node
