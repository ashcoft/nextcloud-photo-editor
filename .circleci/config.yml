# CircleCI mirror of the GitHub Actions checks, so a change is verified here
# too. The image matches the Node major in package.json's `engines`, and ships
# the pnpm version `packageManager` pins, so no package-manager setup is needed.
version: 2.1

jobs:
  node:
    docker:
      - image: cimg/node:26.13
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Lint and type-check
          command: |
            pnpm run lint
            pnpm run stylelint
            pnpm run check-types
      - run:
          name: Unit tests
          command: pnpm run test
      - run:
          name: Build
          command: pnpm run build

workflows:
  test:
    jobs:
      - node
